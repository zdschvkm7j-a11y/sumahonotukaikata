<h2>でんわのしかた</h2>
<p>1 でんわのあいこんをえらびます</p>
<p>2 ひだりからよくつかうこうもく。りれき。れんらくさき。きーぱっど。るすばんでんわ</p>
<p>3 れんらくさきからえらぶか。きーぱっどでばんごうをうつ</p>

<script>
                //音声を読み上げる関数
                    function yomu(text) {
                   const speech = new SpeechSynthesisUtterance(text);
                    speech.lang = "ja-JP";
                    
                    //再生中の音声を一度クリアしてすぐに新しい文字を喋る　
                    speechSynthesis.cancel() ;
                    speechSynthesis.speak(speech);
                  }
                    //音声を止める関数
                    function tomeru(){
                        speechSynthesis.cancel();
                    }

            </script>
