<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ほすうけいのつかいかた</title>
  <style>
    :root {
      --bg: #eef7ff;
      --panel: #ffffff;
      --line: #2d4d8a;
      --text: #1d2433;
      --primary: #1e5bd7;
      --primary-dark: #143f9d;
      --danger: #dc2626;
      --danger-dark: #b91c1c;
      --btn-text: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: linear-gradient(180deg, var(--bg) 0%, #f9fbff 100%);
      color: var(--text);
      font-family: "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
      font-size: 20px;
      line-height: 1.6;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      padding: 12px 18px;
      border-radius: 10px;
      background: #dddddd;
      color: #111;
      text-decoration: none;
      font-size: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .video-panel {
      background: linear-gradient(135deg, #ffffff, #edf4ff);
      border: 3px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(26, 77, 166, 0.12);
      padding: 18px 22px;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0 20px;
      text-align: center;
    }
    .video-caption {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      font-weight: 700;
      color: #113d8f;
      line-height: 1.55;
      word-break: keep-all;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 12px 0 20px;
    }
    .action-btn {
      appearance: none;
      border: 3px solid rgba(0,0,0,0.18);
      border-radius: 16px;
      background: linear-gradient(180deg, var(--primary), var(--primary-dark));
      color: var(--btn-text);
      font-size: clamp(1.15rem, 2vw, 1.6rem);
      font-weight: 700;
      padding: 20px 26px;
      min-height: 74px;
      min-width: 180px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(30,64,175,0.18);
      transition: transform 0.12s ease, filter 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .action-btn:hover { filter: brightness(1.08); }
    .action-btn:active { transform: translateY(2px) scale(0.99); }
    .stop-btn {
      background: linear-gradient(180deg, var(--danger), var(--danger-dark));
      box-shadow: 0 6px 15px rgba(185,28,28,0.18);
    }
    h1 {
      font-size: clamp(1.9rem, 3vw, 2.6rem);
      margin: 12px 0 18px;
    }
    h2 {
      margin-top: 26px; 
      margin-bottom: 12px;
      font-size: clamp(1.45rem, 2.5vw, 2.1rem);
    }
    p { margin: 10px 0; }
    hr { margin: 20px 0; }
    @media (max-width: 600px) {
      body { padding: 15px; }
      .button-row { display: grid; grid-template-columns: 1fr; }
      .action-btn { width: 100%; min-width: 0; }
    }
  </style>
  <link rel="stylesheet" href="readable-theme.css">
<!-- EXPERIENCE_STYLES_START -->
    <style>
      .experience-panel {
        background: linear-gradient(135deg, #fff7d9, #f3f9ff);
        border: 3px solid #d79b2f;
        border-radius: 18px;
        padding: 18px 18px 10px;
        margin: 18px 0 20px;
        box-shadow: 0 8px 18px rgba(87, 76, 0, 0.12);
      }
      .experience-status {
        font-size: 1.05rem;
        font-weight: 800;
        color: #7a4b00;
        margin-bottom: 8px;
      }
      .experience-panel h2 {
        margin: 6px 0 12px;
      }
      .experience-steps {
        display: grid;
        gap: 10px;
        margin: 0 0 12px;
      }
      .experience-step {
        background: #fff;
        border: 2px solid #e5d6a7;
        border-radius: 12px;
        padding: 12px 14px;
        font-weight: 700;
        color: #3a3a3a;
        transition: all 0.15s ease;
      }
      .experience-step.active {
        background: #eaf7ff;
        border-color: #1e5bd7;
        box-shadow: inset 0 0 0 2px rgba(30, 91, 215, 0.25);
      }
      .experience-step.done {
        background: #ebfce9;
        border-color: #5aa16e;
      }
      @media (max-width: 600px) {
        .experience-panel { padding: 16px 12px 8px; }
      }
    </style>
    <!-- EXPERIENCE_STYLES_END -->
</head>
<body class="topic-page">
<!-- TEXT_SIZE_CONTROLS_START -->
    <div class="text-size-controls" data-text-size-controls>
      <span class="text-size-label" data-text-size-label>文字の大きさ：標準</span>
      <button type="button" class="text-size-toggle" data-text-size-toggle aria-label="文字の大きさを変更（現在は標準）">🔤 文字を大きくする</button>
    </div>
    <!-- TEXT_SIZE_CONTROLS_END -->
<a href="index.html" class="back-link">⬅️ もとのがめんにもどる</a>
<div class="video-panel"><div id="video-caption" class="video-caption">説明を待っています</div></div>
<!-- SPEECH_CONTROLS_START -->
    <div class="button-row speech-controls" aria-label="音声の操作">
      <button type="button" class="action-btn" onclick='yomu("毎日何歩歩いたかを記録して、健康管理に役立てます。歩数計アプリは、スマートフォンが自動的に歩数をカウントします。一日の歩数目標を設定することで、運動習慣の改善に役立ちます。毎日の歩数の推移をグラフで確認することもできます。")'>📣 かいせつを再生</button>
      <button type="button" class="action-btn stop-btn" onclick="tomeru()">⏹️ 音声を止める</button>
    </div>
    <!-- SPEECH_CONTROLS_END -->
<!-- EXPERIENCE_MARKUP_START -->
    <div class="experience-panel" id="experience-panel" aria-labelledby="experience-title">
      <div class="experience-status" aria-live="polite">体験ステップ 1 / 5</div>
      <h2 id="experience-title">体験してみよう</h2>
      <div class="experience-steps"><div class="experience-step" data-step="0">1. 歩数計アプリを開く</div><div class="experience-step" data-step="1">2. 今日の数字を確認する</div><div class="experience-step" data-step="2">3. 目標を設定する</div><div class="experience-step" data-step="3">4. 歩いた記録を見直す</div><div class="experience-step" data-step="4">5. 習慣として続ける</div></div>
      <div class="button-row">
        <button type="button" class="action-btn" onclick="nextExperienceStep()">次のステップへ</button>
        <button type="button" class="action-btn stop-btn" onclick="resetExperience()">やり直す</button>
      </div>
    </div>
    <!-- EXPERIENCE_MARKUP_END -->
    <h1>1. ほすうけいのつかいかた</h1>
<hr>
  <h2>やり方</h2>
  <p>1 ひにち、じこく、たいじゅうやしんちょうをにゅうりょくします。</p>
<p>2 あさおきたらみにつけよるねるまえにかくにんします</p>
<p>3 おおくのばあいはじどうてきにこうしんされますがいちぶはじぶんでりっせとのぼたんをながおしする</p>
  <script src="readable-theme.js"></script>
<!-- EXPERIENCE_SCRIPT_START -->
    <script>
      (function () {
        const stepList = ["歩数計アプリを開く", "今日の数字を確認する", "目標を設定する", "歩いた記録を見直す", "習慣として続ける"];
        let experienceIndex = 0;

        function updateCaption(text) {
          const caption = document.getElementById('video-caption');
          if (caption) {
            caption.textContent = text || '説明を待っています';
          }
        }

        function yomu(text) {
          updateCaption(text);
          if (!('speechSynthesis' in window)) {
            return;
          }

          window.speechSynthesis.cancel();
          const speech = new SpeechSynthesisUtterance(text || '説明を待っています');
          speech.lang = 'ja-JP';
          speech.rate = 1;
          speech.pitch = 1;
          speech.volume = 1;
          window.speechSynthesis.speak(speech);
        }

        function tomeru() {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
          updateCaption('音声を止めました');
        }

        function renderExperience() {
          const panel = document.getElementById('experience-panel');
          if (!panel) {
            return;
          }

          const steps = panel.querySelectorAll('.experience-step');
          steps.forEach((node, index) => {
            node.classList.toggle('active', index === experienceIndex);
            node.classList.toggle('done', index < experienceIndex);
          });

          const status = panel.querySelector('.experience-status');
          if (status) {
            status.textContent = '体験ステップ ' + (experienceIndex + 1) + ' / ' + stepList.length;
          }

          const currentStep = stepList[experienceIndex];
          if (currentStep) {
            yomu(currentStep);
          }
        }

        function nextExperienceStep() {
          if (experienceIndex < stepList.length - 1) {
            experienceIndex += 1;
            renderExperience();
            return;
          }

          const panel = document.getElementById('experience-panel');
          const status = panel && panel.querySelector('.experience-status');
          if (status) {
            status.textContent = '体験完了！ すべての手順を確認しました';
          }
        }

        function resetExperience() {
          experienceIndex = 0;
          renderExperience();
        }

        window.__EXPERIENCE_STEPS__ = stepList;
        window.nextExperienceStep = nextExperienceStep;
        window.resetExperience = resetExperience;
        window.yomu = yomu;
        window.tomeru = tomeru;
        window.addEventListener('DOMContentLoaded', renderExperience, { once: true });
      }());
    </script>
    <!-- EXPERIENCE_SCRIPT_END -->
</body>
</html>
