<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>のうのとれーにんぐ</title>
  <style>
    :root {
      --bg: #eef7ff;
      --panel: #ffffff;
      --line: #2d4d8a;
      --text: #1d2433;
      --primary: #1e5bd7;
      --primary-dark: #143f9d;
      --danger: #dc2626;
      --danger-dark: #b91c1c;
      --btn-text: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: linear-gradient(180deg, var(--bg) 0%, #f9fbff 100%);
      color: var(--text);
      font-family: "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
      font-size: 20px;
      line-height: 1.6;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      padding: 12px 18px;
      border-radius: 10px;
      background: #dddddd;
      color: #111;
      text-decoration: none;
      font-size: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 12px 0 20px;
    }
    .action-btn {
      appearance: none;
      border: 3px solid rgba(0,0,0,0.18);
      border-radius: 16px;
      background: linear-gradient(180deg, var(--primary), var(--primary-dark));
      color: var(--btn-text);
      font-size: clamp(1.15rem, 2vw, 1.6rem);
      font-weight: 700;
      padding: 20px 26px;
      min-height: 74px;
      min-width: 180px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(30,64,175,0.18);
      transition: transform 0.12s ease, filter 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .action-btn:hover { filter: brightness(1.08); }
    .action-btn:active { transform: translateY(2px) scale(0.99); }
    .stop-btn {
      background: linear-gradient(180deg, var(--danger), var(--danger-dark));
      box-shadow: 0 6px 15px rgba(185,28,28,0.18);
    }
    h1 {
      font-size: clamp(1.9rem, 3vw, 2.6rem);
      margin: 12px 0 18px;
    }
    h2 {
      margin-top: 26px; 
      margin-bottom: 12px;
      font-size: clamp(1.45rem, 2.5vw, 2.1rem);
    }
    p { margin: 10px 0; }
    hr { margin: 20px 0; }
    @media (max-width: 600px) {
      body { padding: 15px; }
      .button-row { display: grid; grid-template-columns: 1fr; }
      .action-btn { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">⬅️ もとのがめんにもどる</a>
  <h1>1. のうのとれーにんぐ</h1>

  <div class="button-row">
    <button type="button" class="action-btn" id="start-game-btn">🎮 ゲーム開始</button>
  </div>

  <div id="game-container" style="display:none;">
    <div style="background: #ffffff; border: 3px solid #2d4d8a; border-radius: 18px; padding: 30px; margin: 20px 0; box-shadow: 0 10px 24px rgba(26, 77, 166, 0.12);">
      <h2 id="problem-text" style="font-size: 2rem; text-align: center; margin: 20px 0; color: #1e5bd7;">問題が表示されます</h2>
      <div id="score-display" style="text-align: center; font-size: 1.5rem; color: #113d8f; margin-bottom: 20px;">スコア: <span id="score">0</span>/10</div>
      
      <div style="background: #eef7ff; border-radius: 12px; padding: 20px; margin: 20px 0;">
        <p style="font-size: 1.3rem; text-align: center; margin: 10px 0;">答え：</p>
        <input type="number" id="answer-input" placeholder="答えを入力してください" style="width: 100%; padding: 15px; font-size: 1.2rem; border: 2px solid #1e5bd7; border-radius: 8px; text-align: center;">
      </div>

      <div class="button-row" style="justify-content: center;">
        <button type="button" class="action-btn" id="submit-btn">✅ 回答する</button>
        <button type="button" class="action-btn stop-btn" id="quit-btn">⏹️ やめる</button>
      </div>

      <div id="result-message" style="font-size: 1.5rem; text-align: center; margin-top: 20px; color: #1e5bd7; min-height: 30px; font-weight: bold;"></div>
    </div>
  </div>

  <script>
    (function () {
      const startGameBtn = document.getElementById('start-game-btn');
      const gameContainer = document.getElementById('game-container');
      const problemText = document.getElementById('problem-text');
      const answerInput = document.getElementById('answer-input');
      const submitBtn = document.getElementById('submit-btn');
      const quitBtn = document.getElementById('quit-btn');
      const resultMessage = document.getElementById('result-message');
      const scoreDisplay = document.getElementById('score');
      
      let currentProblem = null;
      let currentAnswer = null;
      let score = 0;
      let totalProblems = 10;
      let problemCount = 0;

      function generateProblem() {
        const num1 = Math.floor(Math.random() * 100) + 1;
        const num2 = Math.floor(Math.random() * 100) + 1;
        const operations = ['+', '-', '×'];
        const operation = operations[Math.floor(Math.random() * operations.length)];
        
        let answer;
        let display;
        
        if (operation === '+') {
          answer = num1 + num2;
          display = `${num1} + ${num2} = ?`;
        } else if (operation === '-') {
          answer = num1 - num2;
          display = `${num1} - ${num2} = ?`;
        } else {
          answer = num1 * num2;
          display = `${num1} × ${num2} = ?`;
        }
        
        return { display, answer };
      }

      function showNextProblem() {
        if (problemCount >= totalProblems) {
          showGameOver();
          return;
        }

        problemCount++;
        currentProblem = generateProblem();
        currentAnswer = currentProblem.answer;
        problemText.textContent = currentProblem.display;
        answerInput.value = '';
        resultMessage.textContent = '';
        resultMessage.style.color = '#1e5bd7';
        answerInput.focus();
        scoreDisplay.textContent = score;
      }

      function checkAnswer() {
        const userAnswer = parseInt(answerInput.value);
        
        if (isNaN(userAnswer)) {
          resultMessage.textContent = '数字を入力してください';
          resultMessage.style.color = '#dc2626';
          return;
        }

        if (userAnswer === currentAnswer) {
          score++;
          resultMessage.textContent = '🎉 正解！';
          resultMessage.style.color = '#16a34a';
          scoreDisplay.textContent = score;
          setTimeout(() => {
            showNextProblem();
          }, 1500);
        } else {
          resultMessage.textContent = `❌ 不正解（正答: ${currentAnswer}）`;
          resultMessage.style.color = '#dc2626';
          setTimeout(() => {
            showNextProblem();
          }, 1500);
        }
      }

      function showGameOver() {
        problemText.textContent = 'ゲーム終了！';
        answerInput.style.display = 'none';
        submitBtn.style.display = 'none';
        resultMessage.textContent = `最終スコア: ${score}/${totalProblems}`;
        resultMessage.style.color = '#1e5bd7';
        resultMessage.style.fontSize = '1.8rem';
      }

      function startGame() {
        score = 0;
        problemCount = 0;
        gameContainer.style.display = 'block';
        startGameBtn.style.display = 'none';
        answerInput.style.display = 'block';
        submitBtn.style.display = 'inline-flex';
        showNextProblem();
      }

      function quitGame() {
        gameContainer.style.display = 'none';
        startGameBtn.style.display = 'inline-flex';
        score = 0;
        problemCount = 0;
        scoreDisplay.textContent = '0';
      }

      if (startGameBtn) {
        startGameBtn.addEventListener('click', startGame);
      }

      if (submitBtn) {
        submitBtn.addEventListener('click', checkAnswer);
      }

      if (quitBtn) {
        quitBtn.addEventListener('click', quitGame);
      }
    })();
  </script>
</body>
</html>
