<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>のうのとれーにんぐ</title>
  <style>
    :root {
      --bg: #eef7ff;
      --panel: #ffffff;
      --line: #2d4d8a;
      --text: #1d2433;
      --primary: #1e5bd7;
      --primary-dark: #143f9d;
      --danger: #dc2626;
      --danger-dark: #b91c1c;
      --btn-text: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: linear-gradient(180deg, var(--bg) 0%, #f9fbff 100%);
      color: var(--text);
      font-family: "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
      font-size: 20px;
      line-height: 1.6;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      padding: 12px 18px;
      border-radius: 10px;
      background: #dddddd;
      color: #111;
      text-decoration: none;
      font-size: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin: 12px 0 20px;
    }
    #difficulty-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin: 24px 0 28px;
    }
    .difficulty-btn {
      appearance: none;
      border: 3px solid rgba(0,0,0,0.18);
      border-radius: 18px;
      background: #e2e8f0;
      color: var(--text);
      font-size: clamp(1.15rem, 2vw, 1.5rem);
      font-weight: 800;
      padding: 20px 22px;
      min-height: 72px;
      cursor: pointer;
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
    }
    .difficulty-btn.easy { background: linear-gradient(180deg, #4ade80, #16a34a); color: #fff; }
    .difficulty-btn.normal { background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #fff; }
    .difficulty-btn.hard { background: linear-gradient(180deg, #f87171, #dc2626); color: #fff; }
    .difficulty-btn.active {
      box-shadow: 0 10px 22px rgba(30,64,175,0.25);
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.7);
      filter: brightness(1.04);
    }
    .action-btn {
      appearance: none;
      border: 3px solid rgba(0,0,0,0.18);
      border-radius: 16px;
      background: linear-gradient(180deg, var(--primary), var(--primary-dark));
      color: var(--btn-text);
      font-size: clamp(1.15rem, 2vw, 1.6rem);
      font-weight: 700;
      padding: 20px 26px;
      min-height: 74px;
      min-width: 180px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(30,64,175,0.18);
      transition: transform 0.12s ease, filter 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .action-btn:hover { filter: brightness(1.08); }
    .action-btn:active { transform: translateY(2px) scale(0.99); }
    .stop-btn {
      background: linear-gradient(180deg, var(--danger), var(--danger-dark));
      box-shadow: 0 6px 15px rgba(185,28,28,0.18);
    }
    h1 {
      font-size: clamp(1.9rem, 3vw, 2.6rem);
      margin: 12px 0 18px;
    }
    h2 {
      margin-top: 26px; 
      margin-bottom: 12px;
      font-size: clamp(1.45rem, 2.5vw, 2.1rem);
    }
    p { margin: 10px 0; }
    hr { margin: 20px 0; }
    @media (max-width: 600px) {
      body { padding: 15px; }
      .button-row { display: grid; grid-template-columns: 1fr; }
      .action-btn { width: 100%; min-width: 0; }
    }
  </style>
  <link rel="stylesheet" href="readable-theme.css">
<!-- EXPERIENCE_STYLES_START -->
    <style>
      .experience-panel {
        background: linear-gradient(135deg, #fff7d9, #f3f9ff);
        border: 3px solid #d79b2f;
        border-radius: 18px;
        padding: 18px 18px 10px;
        margin: 18px 0 20px;
        box-shadow: 0 8px 18px rgba(87, 76, 0, 0.12);
      }
      .experience-status {
        font-size: 1.05rem;
        font-weight: 800;
        color: #7a4b00;
        margin-bottom: 8px;
      }
      .experience-panel h2 {
        margin: 6px 0 12px;
      }
      .experience-steps {
        display: grid;
        gap: 10px;
        margin: 0 0 12px;
      }
      .experience-step {
        background: #fff;
        border: 2px solid #e5d6a7;
        border-radius: 12px;
        padding: 12px 14px;
        font-weight: 700;
        color: #3a3a3a;
        transition: all 0.15s ease;
      }
      .experience-step.active {
        background: #eaf7ff;
        border-color: #1e5bd7;
        box-shadow: inset 0 0 0 2px rgba(30, 91, 215, 0.25);
      }
      .experience-step.done {
        background: #ebfce9;
        border-color: #5aa16e;
      }
      @media (max-width: 600px) {
        .experience-panel { padding: 16px 12px 8px; }
      }
    </style>
    <!-- EXPERIENCE_STYLES_END -->
</head>
<body class="topic-page">
<a href="index.html" class="back-link">⬅️ もとのがめんにもどる</a>
<!-- SPEECH_CONTROLS_START -->
    <div class="button-row speech-controls" aria-label="音声の操作">
      <button type="button" class="action-btn" onclick='yomu("スマートフォンを使って、脳を活性化させるトレーニングができます。パズルやクイズなど、さまざまなゲームが用意されています。毎日少しの時間をかけてトレーニングすることで、認知機能の維持や向上に役立ちます。")'>📣 かいせつを再生</button>
      <button type="button" class="action-btn stop-btn" onclick="tomeru()">⏹️ 音声を止める</button>
    </div>
    <!-- SPEECH_CONTROLS_END -->
<!-- EXPERIENCE_MARKUP_START -->
    <div class="experience-panel" id="experience-panel" aria-labelledby="experience-title">
      <div class="experience-status" aria-live="polite">体験ステップ 1 / 5</div>
      <h2 id="experience-title">体験してみよう</h2>
      <div class="experience-steps"><div class="experience-step" data-step="0">1. 脳トレアプリを開く</div><div class="experience-step" data-step="1">2. ゲームを選ぶ</div><div class="experience-step" data-step="2">3. まずは簡単な問題から始める</div><div class="experience-step" data-step="3">4. 少しずつ難しくする</div><div class="experience-step" data-step="4">5. 続けて習慣にする</div></div>
      <div class="button-row">
        <button type="button" class="action-btn" onclick="nextExperienceStep()">次のステップへ</button>
        <button type="button" class="action-btn stop-btn" onclick="resetExperience()">やり直す</button>
      </div>
    </div>
    <!-- EXPERIENCE_MARKUP_END -->
    <h1>1. のうのとれーにんぐ</h1>

  <div style="margin: 20px 0 12px; text-align: center; font-size: 1.5rem; font-weight: 800; color: #1e5bd7;">
    なんいどをえらんでください
  </div>

  <div class="button-row" id="difficulty-row">
    <button type="button" class="difficulty-btn easy active" data-difficulty="easy">簡単</button>
    <button type="button" class="difficulty-btn normal" data-difficulty="normal">ふつう</button>
    <button type="button" class="difficulty-btn hard" data-difficulty="hard">むずかしい</button>
  </div>

  <div id="game-container" style="display:none;">
    <div style="background: #ffffff; border: 3px solid #2d4d8a; border-radius: 18px; padding: 30px; margin: 20px 0; box-shadow: 0 10px 24px rgba(26, 77, 166, 0.12);">
      <h2 id="problem-text" style="font-size: 2rem; text-align: center; margin: 20px 0; color: #1e5bd7;">問題が表示されます</h2>
      <div id="score-display" style="text-align: center; font-size: 1.5rem; color: #113d8f; margin-bottom: 8px;">スコア: <span id="score">0</span>/10</div>
      <div id="level-display" style="text-align: center; font-size: 1.3rem; color: #0f172a; margin-bottom: 8px; font-weight: bold;">レベル: 簡単</div>
      <div id="streak-display" style="text-align: center; font-size: 1.2rem; color: #0f766e; margin-bottom: 8px; font-weight: bold;">連続正解: 0</div>
      <div id="best-score-display" style="text-align: center; font-size: 1.2rem; color: #7c2d12; margin-bottom: 20px; font-weight: bold;">最高記録: 0</div>
      
      <div style="background: #eef7ff; border-radius: 12px; padding: 20px; margin: 20px 0;">
        <p style="font-size: 1.3rem; text-align: center; margin: 10px 0;">答え：</p>
        <input type="number" id="answer-input" placeholder="答えを入力してください" style="width: 100%; padding: 15px; font-size: 1.2rem; border: 2px solid #1e5bd7; border-radius: 8px; text-align: center;">
      </div>

      <div class="button-row" style="justify-content: center;">
        <button type="button" class="action-btn" id="submit-btn">✅ 回答する</button>
        <button type="button" class="action-btn stop-btn" id="quit-btn">⏹️ やめる</button>
      </div>

      <div id="result-message" style="font-size: 1.5rem; text-align: center; margin-top: 20px; color: #1e5bd7; min-height: 30px; font-weight: bold;"></div>
    </div>
  </div>
  <script src="readable-theme.js"></script>
  <script src="brain-training.js"></script>
<!-- EXPERIENCE_SCRIPT_START -->
    <script>
      (function () {
        const stepList = ["脳トレアプリを開く", "ゲームを選ぶ", "まずは簡単な問題から始める", "少しずつ難しくする", "続けて習慣にする"];
        let experienceIndex = 0;

        function updateCaption(text) {
          const caption = document.getElementById('video-caption');
          if (caption) {
            caption.textContent = text || '説明を待っています';
          }
        }

        function yomu(text) {
          updateCaption(text);
          if (!('speechSynthesis' in window)) {
            return;
          }

          window.speechSynthesis.cancel();
          const speech = new SpeechSynthesisUtterance(text || '説明を待っています');
          speech.lang = 'ja-JP';
          speech.rate = 1;
          speech.pitch = 1;
          speech.volume = 1;
          window.speechSynthesis.speak(speech);
        }

        function tomeru() {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
          updateCaption('音声を止めました');
        }

        function renderExperience() {
          const panel = document.getElementById('experience-panel');
          if (!panel) {
            return;
          }

          const steps = panel.querySelectorAll('.experience-step');
          steps.forEach((node, index) => {
            node.classList.toggle('active', index === experienceIndex);
            node.classList.toggle('done', index < experienceIndex);
          });

          const status = panel.querySelector('.experience-status');
          if (status) {
            status.textContent = '体験ステップ ' + (experienceIndex + 1) + ' / ' + stepList.length;
          }

          const currentStep = stepList[experienceIndex];
          if (currentStep) {
            yomu(currentStep);
          }
        }

        function nextExperienceStep() {
          if (experienceIndex < stepList.length - 1) {
            experienceIndex += 1;
            renderExperience();
            return;
          }

          const panel = document.getElementById('experience-panel');
          const status = panel && panel.querySelector('.experience-status');
          if (status) {
            status.textContent = '体験完了！ すべての手順を確認しました';
          }
        }

        function resetExperience() {
          experienceIndex = 0;
          renderExperience();
        }

        window.__EXPERIENCE_STEPS__ = stepList;
        window.nextExperienceStep = nextExperienceStep;
        window.resetExperience = resetExperience;
        window.yomu = yomu;
        window.tomeru = tomeru;
        window.addEventListener('DOMContentLoaded', renderExperience, { once: true });
      }());
    </script>
    <!-- EXPERIENCE_SCRIPT_END -->
</body>
</html>
