            <script>
                //音声を読み上げる関数
                    function yomu(text, url) {
                   const speech = new SpeechSynthesisUtterance(text);
                    speech.lang = "ja-JP";
                    speechSynthesis.cancel()
                    
                    //喋り終わったらページを移動する処理
                    if (url) {
                        speech.onend = function(){
                       location.href = url;
                    };
                    
                  }
                    speechSynthesis.speak(speech);
                    }
                  function tomeru() {
                    speechSynthesis.cancel();

                  }
            </script>
